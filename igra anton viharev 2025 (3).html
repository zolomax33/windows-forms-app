<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🎰 Lucky Slots - Слот Машина</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
            user-select: none;
        }

        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: white;
            font-family: 'Arial', sans-serif;
            min-height: 100vh;
            padding: 10px;
            overflow-x: hidden;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        /* Шапка */
        .header {
            text-align: center;
            padding: 20px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 20px;
            margin-bottom: 20px;
            border: 2px solid rgba(255, 215, 0, 0.3);
        }

        .game-title {
            font-size: 2.5em;
            color: gold;
            text-shadow: 0 0 10px gold;
            margin-bottom: 10px;
        }

        /* Инфо панель */
        .info-panel {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .info-box {
            background: rgba(0, 0, 0, 0.6);
            padding: 15px;
            border-radius: 15px;
            text-align: center;
            border: 2px solid #4cc9f0;
        }

        .info-label {
            font-size: 14px;
            color: #aaa;
            margin-bottom: 5px;
        }

        .info-value {
            font-size: 28px;
            font-weight: bold;
            color: #4cc9f0;
        }

        .info-value.win {
            color: gold;
            animation: pulse 1s infinite;
        }

        /* Игровой автомат */
        .slot-machine {
            background: rgba(0, 0, 0, 0.7);
            border-radius: 25px;
            padding: 25px;
            margin-bottom: 20px;
            border: 3px solid gold;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.3);
            position: relative;
            overflow: hidden;
        }

        /* Барабаны */
        .reels {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 30px 0;
            perspective: 1000px;
        }

        .reel {
            width: 120px;
            height: 120px;
            background: white;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 60px;
            border: 5px solid #4cc9f0;
            transform-style: preserve-3d;
            transition: transform 0.3s;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
        }

        .reel.spinning {
            animation: spin 0.1s linear infinite;
        }

        .reel.win {
            border-color: gold;
            box-shadow: 0 0 30px gold;
            transform: scale(1.1);
        }

        /* Управление ставками */
        .bet-controls {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin: 20px 0;
        }

        .bet-btn {
            padding: 15px;
            background: rgba(76, 201, 240, 0.2);
            border: 2px solid #4cc9f0;
            border-radius: 10px;
            color: #4cc9f0;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .bet-btn:hover, .bet-btn.active {
            background: #4cc9f0;
            color: #0f0c29;
            transform: scale(1.05);
        }

        /* Основные кнопки */
        .controls {
            display: flex;
            gap: 20px;
            margin: 20px 0;
        }

        .main-btn {
            flex: 1;
            padding: 20px;
            border: none;
            border-radius: 15px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .spin-btn {
            background: linear-gradient(45deg, #ff416c, #ff4b2b);
            color: white;
        }

        .spin-btn:hover:not(:disabled) {
            transform: scale(1.05);
            box-shadow: 0 0 20px #ff416c;
        }

        .spin-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .cashout-btn {
            background: linear-gradient(45deg, #00b09b, #96c93d);
            color: white;
        }

        .cashout-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px #00b09b;
        }

        /* Сообщения */
        .message {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            font-size: 20px;
            margin: 20px 0;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s;
        }

        .message.win {
            background: rgba(255, 215, 0, 0.1);
            border-color: gold;
            color: gold;
            animation: winMessage 1s infinite;
        }

        /* История */
        .history {
            background: rgba(0, 0, 0, 0.5);
            padding: 20px;
            border-radius: 15px;
            margin-top: 20px;
        }

        .history-title {
            color: gold;
            font-size: 18px;
            margin-bottom: 15px;
            text-align: center;
        }

        .history-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 200px;
            overflow-y: auto;
        }

        .history-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 15px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            font-size: 16px;
        }

        .history-item.win {
            color: gold;
            background: rgba(255, 215, 0, 0.1);
        }

        .history-item.lose {
            color: #ff416c;
        }

        /* Анимации */
        @keyframes spin {
            0% { transform: translateY(0) rotateX(0); }
            100% { transform: translateY(-120px) rotateX(360deg); }
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        @keyframes winMessage {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        @keyframes confettiFall {
            0% { transform: translateY(-100px) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotate(360deg); opacity: 0; }
        }

        /* Конфетти */
        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            pointer-events: none;
            z-index: 1000;
        }

        /* Адаптивность для телефона */
        @media (max-width: 768px) {
            .info-panel {
                grid-template-columns: 1fr;
                gap: 10px;
            }

            .reels {
                gap: 10px;
            }

            .reel {
                width: 80px;
                height: 80px;
                font-size: 40px;
            }

            .controls {
                flex-direction: column;
            }

            .bet-controls {
                grid-template-columns: repeat(2, 1fr);
            }

            .main-btn {
                padding: 15px;
                font-size: 18px;
            }

            .game-title {
                font-size: 2em;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 5px;
            }

            .slot-machine {
                padding: 15px;
            }

            .reel {
                width: 70px;
                height: 70px;
                font-size: 35px;
            }

            .message {
                font-size: 18px;
                padding: 15px;
            }
        }

        /* Эффекты выигрыша */
        .win-effect {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 999;
        }

        .firework {
            position: absolute;
            width: 5px;
            height: 5px;
            border-radius: 50%;
            animation: explode 1s forwards;
        }

        @keyframes explode {
            0% {
                transform: scale(1);
                opacity: 1;
            }
            100% {
                transform: scale(20);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Шапка -->
        <div class="header">
            <h1 class="game-title">🎰 Lucky Slots 🎰</h1>
            <p>Крути барабаны и выигрывай!</p>
        </div>

        <!-- Информационная панель -->
        <div class="info-panel">
            <div class="info-box">
                <div class="info-label">Баланс</div>
                <div class="info-value" id="balance">1000</div>
            </div>
            <div class="info-box">
                <div class="info-label">Ставка</div>
                <div class="info-value" id="currentBet">50</div>
            </div>
            <div class="info-box">
                <div class="info-label">Выигрыш</div>
                <div class="info-value" id="lastWin">0</div>
            </div>
        </div>

        <!-- Игровой автомат -->
        <div class="slot-machine">
            <div class="reels">
                <div class="reel" id="reel1">🍒</div>
                <div class="reel" id="reel2">7️⃣</div>
                <div class="reel" id="reel3">💎</div>
            </div>

            <!-- Управление ставками -->
            <div class="bet-controls">
                <button class="bet-btn active" onclick="setBet(10)">10</button>
                <button class="bet-btn" onclick="setBet(50)">50</button>
                <button class="bet-btn" onclick="setBet(100)">100</button>
                <button class="bet-btn" onclick="setBet(500)">500</button>
            </div>

            <!-- Основные кнопки -->
            <div class="controls">
                <button class="main-btn spin-btn" id="spinBtn" onclick="spin()">Крутить 🎰</button>
                <button class="main-btn cashout-btn" onclick="cashout()">Забрать 💰</button>
            </div>

            <!-- Сообщение -->
            <div class="message" id="message">
                Сделайте ставку и нажмите "Крутить"!
            </div>
        </div>

        <!-- История игр -->
        <div class="history">
            <div class="history-title">История игр</div>
            <div class="history-list" id="historyList">
                <!-- История будет добавляться здесь -->
            </div>
        </div>
    </div>

    <!-- Контейнер для конфетти -->
    <div id="confettiContainer"></div>

    <script>
        // Игровые настройки
        const SYMBOLS = ['🍒', '🍋', '🍊', '💎', '7️⃣', '🔔', '⭐', '🍉', '🎯', '👑'];
        const WIN_MULTIPLIERS = {
            '777': 100,    // 3 семерки - супер джекпот
            'TRIPLE': 10,  // 3 одинаковых
            'DOUBLE': 2,   // 2 одинаковых
            'SPECIAL': 5   // Комбинация специальных символов
        };

        // Игровое состояние
        let balance = 1000;
        let currentBet = 50;
        let lastWin = 0;
        let isSpinning = false;
        let gameHistory = [];

        // DOM элементы
        const balanceEl = document.getElementById('balance');
        const currentBetEl = document.getElementById('currentBet');
        const lastWinEl = document.getElementById('lastWin');
        const messageEl = document.getElementById('message');
        const spinBtn = document.getElementById('spinBtn');
        const historyListEl = document.getElementById('historyList');
        const confettiContainer = document.getElementById('confettiContainer');
        const reels = [
            document.getElementById('reel1'),
            document.getElementById('reel2'),
            document.getElementById('reel3')
        ];

        // Установка ставки
        function setBet(amount) {
            if (isSpinning) return;
            
            currentBet = amount;
            updateBetButtons();
            updateDisplay();
        }

        // Обновление кнопок ставок
        function updateBetButtons() {
            document.querySelectorAll('.bet-btn').forEach(btn => {
                const btnText = btn.textContent;
                const btnAmount = parseInt(btnText);
                btn.classList.toggle('active', btnAmount === currentBet);
            });
        }

        // Вращение барабанов
        function spin() {
            if (isSpinning) return;
            
            // Проверка баланса
            if (balance < currentBet) {
                showMessage('Недостаточно средств!', 'error');
                return;
            }

            // Начало спина
            isSpinning = true;
            balance -= currentBet;
            spinBtn.disabled = true;
            
            showMessage('Барабаны крутятся...', 'spin');
            
            // Анимация вращения
            startSpinAnimation();
            
            // Завершение спина через 2 секунды
            setTimeout(() => {
                finishSpin();
            }, 2000);
            
            updateDisplay();
        }

        // Анимация вращения
        function startSpinAnimation() {
            reels.forEach(reel => {
                reel.classList.add('spinning');
                
                // Быстрая смена символов для эффекта вращения
                const spinInterval = setInterval(() => {
                    const randomSymbol = SYMBOLS[Math.floor(Math.random() * SYMBOLS.length)];
                    reel.textContent = randomSymbol;
                }, 100);
                
                // Сохраняем ID интервала для очистки
                reel.spinInterval = spinInterval;
            });
        }

        // Завершение вращения
        function finishSpin() {
            // Остановка анимации
            reels.forEach(reel => {
                clearInterval(reel.spinInterval);
                reel.classList.remove('spinning');
            });

            // Генерация результатов
            const results = generateResults();
            
            // Отображение результатов
            reels.forEach((reel, index) => {
                reel.textContent = results[index];
            });

            // Расчет выигрыша
            const winResult = calculateWin(results);
            
            // Обновление баланса
            lastWin = winResult.amount;
            if (lastWin > 0) {
                balance += lastWin;
                // Эффекты при выигрыше
                createWinEffects(winResult.multiplier);
                showMessage(winResult.message, 'win');
            } else {
                showMessage('Повезет в следующий раз!', 'lose');
            }

            // Добавление в историю
            addToHistory(results, winResult);

            // Завершение спина
            isSpinning = false;
            spinBtn.disabled = false;
            updateDisplay();
        }

        // Генерация результатов с увеличенным шансом на выигрыш
        function generateResults() {
            const random = Math.random();
            
            if (random < 0.05) { // 5% шанс на 777
                return ['7️⃣', '7️⃣', '7️⃣'];
            } else if (random < 0.2) { // 15% шанс на три одинаковых
                const symbol = SYMBOLS[Math.floor(Math.random() * 8)];
                return [symbol, symbol, symbol];
            } else if (random < 0.5) { // 30% шанс на два одинаковых
                const symbol = SYMBOLS[Math.floor(Math.random() * SYMBOLS.length)];
                const otherSymbol = SYMBOLS.find(s => s !== symbol);
                const positions = [0, 1, 2];
                const samePos1 = positions.splice(Math.floor(Math.random() * positions.length), 1)[0];
                const samePos2 = positions.splice(Math.floor(Math.random() * positions.length), 1)[0];
                const diffPos = positions[0];
                
                const result = [];
                result[samePos1] = symbol;
                result[samePos2] = symbol;
                result[diffPos] = otherSymbol;
                return result;
            } else {
                // Случайные символы
                return [
                    SYMBOLS[Math.floor(Math.random() * SYMBOLS.length)],
                    SYMBOLS[Math.floor(Math.random() * SYMBOLS.length)],
                    SYMBOLS[Math.floor(Math.random() * SYMBOLS.length)]
                ];
            }
        }

        // Расчет выигрыша
        function calculateWin(results) {
            const [a, b, c] = results;
            
            // Джекпот 777
            if (a === '7️⃣' && b === '7️⃣' && c === '7️⃣') {
                return {
                    amount: currentBet * WIN_MULTIPLIERS['777'],
                    multiplier: WIN_MULTIPLIERS['777'],
                    message: '🎉 ДЖЕКПОТ! 777! 🎉'
                };
            }
            
            // Три одинаковых
            if (a === b && b === c) {
                return {
                    amount: currentBet * WIN_MULTIPLIERS['TRIPLE'],
                    multiplier: WIN_MULTIPLIERS['TRIPLE'],
                    message: `Три ${a}! Отличный выигрыш!`
                };
            }
            
            // Два одинаковых
            if (a === b || b === c || a === c) {
                return {
                    amount: currentBet * WIN_MULTIPLIERS['DOUBLE'],
                    multiplier: WIN_MULTIPLIERS['DOUBLE'],
                    message: 'Два одинаковых символа!'
                };
            }
            
            // Специальная комбинация (все разные специальные символы)
            const specialSymbols = ['💎', '👑', '🎯'];
            if (specialSymbols.includes(a) && specialSymbols.includes(b) && specialSymbols.includes(c)) {
                return {
                    amount: currentBet * WIN_MULTIPLIERS['SPECIAL'],
                    multiplier: WIN_MULTIPLIERS['SPECIAL'],
                    message: 'Специальная комбинация!'
                };
            }
            
            // Проигрыш
            return {
                amount: 0,
                multiplier: 0,
                message: ''
            };
        }

        // Создание эффектов при выигрыше
        function createWinEffects(multiplier) {
            // Подсветка барабанов
            reels.forEach(reel => {
                reel.classList.add('win');
                setTimeout(() => reel.classList.remove('win'), 1000);
            });
            
            // Создание конфетти
            createConfetti(multiplier > 10 ? 200 : 50);
            
            // Фейерверки для больших выигрышей
            if (multiplier >= 10) {
                createFireworks();
            }
            
            // Вибрация (если поддерживается)
            if (navigator.vibrate) {
                navigator.vibrate([100, 50, 100]);
            }
        }

        // Создание конфетти
        function createConfetti(count = 100) {
            const colors = ['#ff0000', '#00ff00', '#0000ff', '#ffff00', '#ff00ff', '#00ffff', '#ff9900'];
            
            for (let i = 0; i < count; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.cssText = `
                    left: ${Math.random() * 100}vw;
                    background: ${colors[Math.floor(Math.random() * colors.length)]};
                    animation: confettiFall ${1 + Math.random() * 2}s linear forwards;
                `;
                
                confettiContainer.appendChild(confetti);
                
                // Удаление после анимации
                setTimeout(() => {
                    confetti.remove();
                }, 3000);
            }
        }

        // Создание фейерверков
        function createFireworks() {
            for (let i = 0; i < 5; i++) {
                setTimeout(() => {
                    createFirework(
                        Math.random() * window.innerWidth,
                        Math.random() * window.innerHeight / 2
                    );
                }, i * 300);
            }
        }

        function createFirework(x, y) {
            const firework = document.createElement('div');
            firework.className = 'firework';
            firework.style.cssText = `
                left: ${x}px;
                top: ${y}px;
                background: hsl(${Math.random() * 360}, 100%, 50%);
            `;
            
            document.body.appendChild(firework);
            
            setTimeout(() => {
                firework.remove();
            }, 1000);
        }

        // Добавление в историю
        function addToHistory(results, winResult) {
            const historyItem = {
                symbols: results.join(' '),
                bet: currentBet,
                win: winResult.amount,
                time: new Date().toLocaleTimeString()
            };
            
            gameHistory.unshift(historyItem);
            
            // Ограничение истории 10 записями
            if (gameHistory.length > 10) {
                gameHistory.pop();
            }
            
            updateHistoryDisplay();
        }

        // Обновление истории
        function updateHistoryDisplay() {
            historyListEl.innerHTML = '';
            
            gameHistory.forEach(item => {
                const div = document.createElement('div');
                div.className = `history-item ${item.win > 0 ? 'win' : 'lose'}`;
                div.innerHTML = `
                    <span>${item.symbols}</span>
                    <span>${item.win > 0 ? '+' + item.win : '-' + item.bet}</span>
                    <span>${item.time}</span>
                `;
                historyListEl.appendChild(div);
            });
        }

        // Забрать деньги
        function cashout() {
            const confirmMsg = `Забрать ${balance} виртуальных денег?`;
            if (confirm(confirmMsg)) {
                showMessage(`Вы забрали ${balance}! Игра начинается заново.`, 'win');
                balance = 1000;
                currentBet = 50;
                lastWin = 0;
                gameHistory = [];
                updateDisplay();
                updateHistoryDisplay();
                updateBetButtons();
            }
        }

        // Обновление отображения
        function updateDisplay() {
            balanceEl.textContent = balance;
            currentBetEl.textContent = currentBet;
            lastWinEl.textContent = lastWin;
            lastWinEl.className = lastWin > 0 ? 'info-value win' : 'info-value';
        }

        // Показать сообщение
        function showMessage(text, type) {
            messageEl.textContent = text;
            messageEl.className = 'message';
            
            if (type === 'win') {
                messageEl.classList.add('win');
            } else if (type === 'error') {
                messageEl.style.color = '#ff416c';
            } else if (type === 'spin') {
                messageEl.style.color = '#4cc9f0';
            }
        }

        // Инициализация при загрузке
        window.onload = function() {
            updateDisplay();
            updateBetButtons();
            updateHistoryDisplay();
        };

        // Обработка свайпов на мобильных хуй член 
        let touchStartY = 0;
        
        document.addEventListener('touchstart', function(e) {
            touchStartY = e.touches[0].clientY;
        }, false);

        document.addEventListener('touchend', function(e) {
            if (isSpinning) return;
            
            const touchEndY = e.changedTouches[0].clientY;
            const diffY = touchStartY - touchEndY;
            
            // Свайп вниз для спина
            if (diffY > 50) {
                spin();
            }
            
            // Свайп вверх для вывода
            if (diffY < -50) {
                cashout();
            }
        }, false);
    </script>
</body>
</html>
